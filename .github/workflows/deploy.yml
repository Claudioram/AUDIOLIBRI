name: Deploy to audio-book-generator

on:
  workflow_dispatch:
  push:
    branches: [claude/audiobook-generator-setup-WgvfR]
    paths-ignore:
      - 'storage/**'
      - '**.md'
      - '.github/workflows/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HOST: 62.238.12.111
      APP_PASSWORD: audiobook2025
      JWT_SECRET: f2c9f0c3cc4bcca4a3b88b6b9fcc961aa9530de8501df4ffcacc842450d49fad
      MINIMAX_API_KEY: sk-api-S88yW2ZRgzDiwfadmQ1pDMhFMIlhtwZYZ8f8vGE31vU3Mbx5AVMxe5gLbHogX47gM0RxnkeiEX2_LEqplm4_woMxO2oFHOI5oN_t2vFArW6__ZgJtB8sws8
      MINIMAX_GROUP_ID: "2053486809635107724"
    steps:
      - uses: actions/checkout@v4

      - name: Install rsync
        run: sudo apt-get update -qq && sudo apt-get install -y -qq rsync

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H $HOST >> ~/.ssh/known_hosts 2>/dev/null || true
          echo "SSH key pronta"

      - name: Wait for SSH
        run: |
          for i in {1..15}; do
            if ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=8 -o BatchMode=yes root@$HOST "echo ok" 2>/dev/null; then
              echo "SSH connesso al tentativo $i"
              break
            fi
            echo "Tentativo $i fallito, retry in 8s..."
            sleep 8
          done

      - name: Inventory server
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no root@$HOST "
            echo '=== OS ===' && cat /etc/os-release | head -3
            echo '=== Docker ===' && (docker --version 2>/dev/null || echo 'non installato')
            echo '=== Porte ===' && (ss -tlnp | grep -E ':80|:443|:8000|:6379' || echo 'nessuna')
          "

      - name: Install Docker
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no root@$HOST "
            if ! command -v docker >/dev/null 2>&1; then
              curl -fsSL https://get.docker.com | sh
              systemctl enable docker
              echo 'Docker installato'
            else
              echo 'Docker presente:' \$(docker --version)
            fi
          "

      - name: Prepare directories
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no root@$HOST "
            mkdir -p /opt/audiobook/storage/audio \
                     /opt/audiobook/storage/pdfs \
                     /opt/audiobook/storage/reference \
                     /opt/audiobook/data
          "

      - name: Sync code
        run: |
          rsync -az --delete \
            --exclude='.git' \
            --exclude='storage/audio' \
            --exclude='storage/pdfs' \
            --exclude='storage/test_audio' \
            --exclude='.env' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='.venv' \
            -e "ssh -i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            ./ root@$HOST:/opt/audiobook/

      - name: Write .env
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no root@$HOST "cat > /opt/audiobook/.env" << 'ENVEOF'
          APP_PASSWORD=audiobook2025
          JWT_SECRET=f2c9f0c3cc4bcca4a3b88b6b9fcc961aa9530de8501df4ffcacc842450d49fad
          JWT_EXPIRY_HOURS=720
          MINIMAX_API_KEY=sk-api-S88yW2ZRgzDiwfadmQ1pDMhFMIlhtwZYZ8f8vGE31vU3Mbx5AVMxe5gLbHogX47gM0RxnkeiEX2_LEqplm4_woMxO2oFHOI5oN_t2vFArW6__ZgJtB8sws8
          MINIMAX_GROUP_ID=2053486809635107724
          MINIMAX_MODEL=speech-02-hd
          MINIMAX_DEFAULT_VOICE_ID=narratore_rai
          STORAGE_PATH=/app/storage
          DATA_PATH=/app/data
          REDIS_URL=redis://redis:6379/0
          DOMAIN=62.238.12.111
          MAX_PDF_SIZE_MB=200
          MAX_CHAPTER_CHARS=50000
          ENVEOF

      - name: Build and start services
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no root@$HOST "
            set -e
            cd /opt/audiobook
            docker compose -f docker-compose.server.yml down --remove-orphans 2>/dev/null || true
            docker compose -f docker-compose.server.yml up -d --build
            docker compose -f docker-compose.server.yml ps
          "

      - name: Health check
        run: |
          sleep 15
          for i in {1..10}; do
            CODE=\$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 http://$HOST/ 2>/dev/null || echo "000")
            echo "Tentativo $i: HTTP \$CODE"
            if echo "\$CODE" | grep -qE '^(200|302|303|307|308)$'; then
              echo "App ONLINE — http://$HOST"
              exit 0
            fi
            sleep 8
          done
          echo "App non risponde. Logs:"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no root@$HOST "cd /opt/audiobook && docker compose -f docker-compose.server.yml logs --tail=100"
          exit 1
