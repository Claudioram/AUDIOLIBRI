[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "audiobook-generator"
version = "0.1.0"
description = "PDF to audiobook converter with MiniMax TTS"
requires-python = ">=3.11"

dependencies = [
    # Web framework
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",

    # Settings
    "pydantic-settings>=2.3.0",

    # Database
    "sqlmodel>=0.0.19",
    "aiosqlite>=0.20.0",

    # Auth
    "bcrypt>=4.1.3",
    "PyJWT>=2.8.0",

    # PDF parsing
    "PyMuPDF>=1.24.0",

    # OCR fallback
    "surya-ocr>=0.6.0",

    # Text normalization
    "num2words>=0.5.13",

    # HTTP client (async)
    "httpx>=0.27.0",

    # Job queue
    "rq>=1.16.2",
    "redis>=5.0.6",

    # Hetzner Cloud
    "hcloud>=2.0.0",

    # Logging
    "loguru>=0.7.2",

    # CLI
    "typer>=0.12.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",  # TestClient
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.scripts]
audiobook = "app.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
